name: Build Electron Executables

on:
  push:
    tags:
      - 'v*' # Triggers the build automatically whenever you push a version tag like v1.0.0

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Spin up all three OS environments in parallel
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package App
        run: npm run dist
        env:
          # This automatically attaches your built files to a GitHub Release draft
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
